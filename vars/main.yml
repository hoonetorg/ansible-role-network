---
network_connections_dir: /etc/NetworkManager/system-connections
network_same_mac_file: /etc/NetworkManager/conf.d/99-sameMAC.conf
network_connection_types: [ethernet, wifi]
network_wifi_key_mgmt: [sae, wpa-psk]
network_ip_regex: '^(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}$'
network_cidr_regex: '^(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}/([0-9]|[12][0-9]|3[0-2])$'
